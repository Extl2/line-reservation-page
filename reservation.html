<!DOCTYPE html>
<html lang="ja">
<head>

  function gtag(){dataLayer.push(arguments);}

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ご予約フォーム</title>
  <style>
    :root {
      --bg: #f7f8fc;
      --card: #ffffff;
      --text: #1f2937;
      --sub: #6b7280;
      --line: #dbe2ea;
      --accent: #06c755;
      --accent-dark: #05a847;
      --danger: #d92d20;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 20px 14px 40px;
    }

    .hero {
      background: linear-gradient(135deg, #06c755 0%, #2fd56f 100%);
      color: #fff;
      border-radius: 18px;
      padding: 22px 18px;
      box-shadow: 0 12px 28px rgba(6, 199, 85, 0.18);
      margin-bottom: 16px;
    }

    .hero .badge {
      display: inline-block;
      background: rgba(255,255,255,0.18);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.3;
    }

    .hero p {
      margin: 0;
      font-size: 14px;
      opacity: 0.96;
    }

    .card {
      background: var(--card);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.06);
      border: 1px solid #edf1f5;
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .step {
      background: #f2fdf7;
      color: #08763a;
      border: 1px solid #ccefd8;
      border-radius: 12px;
      text-align: center;
      padding: 10px 8px;
      font-size: 12px;
      font-weight: 700;
    }

    form {
      display: grid;
      gap: 14px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .required::after {
      content: "必須";
      display: inline-block;
      margin-left: 8px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #fff1f1;
      color: var(--danger);
      font-size: 11px;
      font-weight: 700;
      vertical-align: middle;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 14px;
      font-size: 16px;
      background: #fff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(6, 199, 85, 0.12);
    }

    textarea { min-height: 110px; resize: vertical; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .help {
      font-size: 12px;
      color: var(--sub);
      margin-top: 6px;
    }

    .checkbox {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 13px;
      color: var(--sub);
      background: #fafbfc;
      border: 1px solid #edf1f5;
      border-radius: 12px;
      padding: 12px;
    }

    .checkbox input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      flex: 0 0 18px;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px 18px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 10px 20px rgba(6, 199, 85, 0.22);
      transition: background 0.2s, transform 0.05s;
    }

    .btn:hover { background: var(--accent-dark); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { background: #9fd9b3; cursor: not-allowed; box-shadow: none; }

    .note {
      margin-top: 14px;
      font-size: 12px;
      color: var(--sub);
      text-align: center;
    }

    .footer-box {
      margin-top: 16px;
      font-size: 13px;
      color: var(--sub);
      background: #fff;
      border: 1px solid #edf1f5;
      border-radius: 14px;
      padding: 14px;
    }

    .success, .error-box, .loading-box {
      display: none;
      margin-top: 14px;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
    }

    .success {
      background: #ecfdf3;
      border: 1px solid #abefc6;
      color: #067647;
    }

    .error-box {
      background: #fff4f3;
      border: 1px solid #f7b4ae;
      color: #b42318;
    }

    .loading-box {
      background: #f8fafc;
      border: 1px solid #dbe2ea;
      color: #475467;
      display: block;
    }

    .slot-box {
      border: 1px solid #edf1f5;
      background: #fafbfc;
      border-radius: 14px;
      padding: 14px;
    }

    .slot-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .slot-btn {
      appearance: none;
      border: 1px solid #cfd8e3;
      background: #fff;
      color: var(--text);
      border-radius: 12px;
      padding: 12px 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .slot-btn:hover {
      border-color: var(--accent);
      background: #f2fdf7;
    }

    .slot-btn.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      box-shadow: 0 8px 18px rgba(6, 199, 85, 0.18);
    }

    .slot-empty {
      margin-top: 10px;
      font-size: 13px;
      color: var(--sub);
      background: #fff;
      border: 1px dashed #cfd8e3;
      border-radius: 12px;
      padding: 12px;
    }

    .selected-slot {
      margin-top: 8px;
      font-size: 13px;
      color: #08763a;
      font-weight: 700;
    }

    .small-muted {
      margin-top: 6px;
      font-size: 12px;
      color: var(--sub);
    }

    @media (max-width: 480px) {
      .hero h1 { font-size: 24px; }
      .grid-2 { grid-template-columns: 1fr; }
      .steps { grid-template-columns: 1fr; }
      .slot-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="badge">簡単予約</div>
      <h1>メディカルダイエットオンライン外来</h1><br><h2>グランエタニティ銀座クリニック<br>ご予約フォーム</h2>
      <p>必要事項をご入力ください。</p>
    </div>

    <div class="card">
　　<button class="btn price-btn" onclick="window.location.href='https://extl2.github.io/mounjaro_flow/ryoukinhyou.html'">
        マンジャロの料金はこちら
      </button>
      
      <form id="reservationForm" action="https://formspree.io/f/mgonvroj" method="POST">
        <div class="slot-box">
          <label class="required" for="date">ご予約日時</label>
          <input id="date" type="date" required />
          <div class="help">空いている日を選ぶと、予約可能な時間だけが表示されます。</div>

          <div id="loadingMessage" class="loading-box">予約枠を読み込み中です…</div>
          <div id="slotArea">
            <div class="slot-empty">日付を選択してください。</div>
          </div>

          <div id="selectedSlotText" class="selected-slot"></div>

          <input type="hidden" id="selectedDate" name="予約日" required />
          <input type="hidden" id="selectedTime" name="予約時間" required />
          <input type="hidden" id="selectedDatetimeLabel" name="予約日時" required />
        </div>
        <div>
          <label class="required" for="name">お名前</label>
          <input id="name" name="お名前" type="text" placeholder="例）山田 花子" required />
        </div>
            <label class="required" for="email">メールアドレス</label>
            <input id="email" name="メールアドレス" type="email" placeholder="例）sample@example.com" required />
          </div>
        <label class="checkbox">
          <input type="checkbox" name="個人情報同意" required />
          <span>個人情報の取扱いに同意のうえ送信します。</span>
        </label>

        <input type="hidden" name="_subject" value="【LINE予約】新規予約申込" />
        <input type="hidden" name="_next" value="https://extl2.github.io/mounjaro_flow/questionnaire.html" />

        <button id="submitBtn" type="submit" class="btn" disabled>予約内容を送信する</button>
      </form>

      <div id="successMessage" class="success">送信されました。担当より順次ご連絡いたします。</div>
      <div id="errorMessage" class="error-box"></div>
      <div class="note">※ この画面では空き枠のみ表示されます。送信後に内容確認のうえご案内します。</div>
    </div>

    <div class="footer-box">
      <strong>ご案内</strong><br>
      休診日や受付停止時間は、予約枠ファイルから自動で除外されます。
    </div>
  </div>

  <script>
    const form = document.getElementById('reservationForm');
    const successMessage = document.getElementById('successMessage');
    const errorMessage = document.getElementById('errorMessage');
    const loadingMessage = document.getElementById('loadingMessage');
    const submitBtn = document.getElementById('submitBtn');

    const dateInput = document.getElementById('date');
    const slotArea = document.getElementById('slotArea');
    const selectedSlotText = document.getElementById('selectedSlotText');

    const selectedDateInput = document.getElementById('selectedDate');
    const selectedTimeInput = document.getElementById('selectedTime');
    const selectedDatetimeLabelInput = document.getElementById('selectedDatetimeLabel');

    let availableSlots = {};

    function setDateLimit() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      dateInput.min = `${yyyy}-${mm}-${dd}`;
    }

    function resetSlotSelection() {
      selectedDateInput.value = '';
      selectedTimeInput.value = '';
      selectedDatetimeLabelInput.value = '';
      selectedSlotText.textContent = '';
    }

    function showError(message) {
      errorMessage.style.display = 'block';
      errorMessage.textContent = message;
      errorMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function clearError() {
      errorMessage.style.display = 'none';
      errorMessage.textContent = '';
    }

    function renderSlots(dateStr) {
      resetSlotSelection();

      if (!dateStr) {
        slotArea.innerHTML = '<div class="slot-empty">日付を選択してください。</div>';
        return;
      }

      const slots = availableSlots[dateStr];

      if (!slots || slots.length === 0) {
        slotArea.innerHTML = '<div class="slot-empty">この日は現在ご案内できる枠がありません。別日をご選択ください。</div>';
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'slot-grid';

      slots.forEach(time => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'slot-btn';
        btn.textContent = time;

        btn.addEventListener('click', () => {
          document.querySelectorAll('.slot-btn').forEach(el => el.classList.remove('active'));
          btn.classList.add('active');

          selectedDateInput.value = dateStr;
          selectedTimeInput.value = time;
          selectedDatetimeLabelInput.value = `${dateStr} ${time}`;
          selectedSlotText.textContent = `選択中：${dateStr} ${time}`;
        });

        grid.appendChild(btn);
      });

      slotArea.innerHTML = '';
      slotArea.appendChild(grid);
    }

    async function loadAvailableSlots() {
      clearError();
      submitBtn.disabled = true;
      try {
        const response = await fetch('./available_slots.json?v=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error('予約枠ファイルを読み込めませんでした。');
        const data = await response.json();
        availableSlots = data && typeof data === 'object' ? data : {};
        loadingMessage.style.display = 'none';
        slotArea.innerHTML = '<div class="slot-empty">日付を選択してください。</div>';
        submitBtn.disabled = false;
      } catch (error) {
        loadingMessage.style.display = 'none';
        slotArea.innerHTML = '<div class="slot-empty">予約枠を読み込めませんでした。</div>';
        showError('available_slots.json の読み込みに失敗しました。ファイル配置をご確認ください。');
      }
    }

    dateInput.addEventListener('change', function () {
      renderSlots(this.value);
    });

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      successMessage.style.display = 'none';
      clearError();

      const action = form.getAttribute('action');
      const nextUrl = 'https://extl2.github.io/mounjaro_flow/questionnaire.html';

      if (!selectedDateInput.value || !selectedTimeInput.value) {
        showError('予約日時を選択してください。');
        return;
      }

      if (action.includes('xxxxxxxx')) {
        successMessage.style.display = 'block';
        successMessage.textContent = '画面サンプルです。1.2秒後に問診ページへ移動します。';
        successMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => {
          window.location.href = nextUrl;
        }, 1200);
        return;
      }

      const formData = new FormData(form);

      try {
        const response = await fetch(action, {
          method: 'POST',
          body: formData,
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          successMessage.style.display = 'block';
          successMessage.textContent = '送信されました。問診ページへ移動します。';
          successMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
          setTimeout(() => {
            window.location.href = nextUrl;
          }, 800);
        } else {
          showError('送信に失敗しました。時間をおいて再度お試しください。');
        }
      } catch (error) {
        showError('通信エラーが発生しました。時間をおいて再度お試しください。');
      }
    });

    setDateLimit();
    loadAvailableSlots();
  </script>
</body>
</html>
